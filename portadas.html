<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portadas y proyectos gráficos de Camilo Alvarez.">
    <title>Portadas | Portafolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #282E2E;
            color: #F5EFE6;
            font-family: Inter, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="min-h-screen">
    <header class="border-b border-[#1F3A29]/50 bg-[#282E2E]/90">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
            <a href="index.html" class="text-xl font-bold tracking-tight text-[#F5EFE6]">VIZ<span class="text-[#E6DCB8]">UAL</span></a>
            <a href="index.html#trabajo" class="text-sm font-medium text-[#E6DCB8] transition-colors hover:text-[#F5EFE6]">Volver al portafolio</a>
        </div>
    </header>

    <main class="mx-auto max-w-6xl px-6 py-16 lg:px-8">
        <div class="mb-10">
            <p class="text-sm font-medium uppercase tracking-wider text-[#98AB9D]">Portafolio creativo</p>
            <h1 class="mt-2 text-4xl font-bold tracking-tight md:text-5xl">Portadas</h1>
            <p class="mt-4 text-[#98AB9D]">Diseños gráficos y portadas.</p>
        </div>
        <section class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-label="Galería de portadas">
            <article>
                <img src="fotos/img1.png" alt="Diseño gráfico de una tarjeta gráfica GeForce RTX" class="aspect-[1/1] w-full rounded-2xl border border-[#1F3A29]/60 bg-[#0E1712] object-cover">
                <p class="mt-3 text-xs uppercase tracking-wider text-[#D5C7A3]">Imagen / Diseño</p>
            </article>
            <div class="flex aspect-[2/3] items-center justify-center rounded-2xl border border-dashed border-[#98AB9D]/50 bg-[#0E1712]/40 text-sm text-[#98AB9D]">
                Agregar imagen
            </div>
            <div class="flex aspect-[2/3] items-center justify-center rounded-2xl border border-dashed border-[#98AB9D]/50 bg-[#0E1712]/40 text-sm text-[#98AB9D]">
                Agregar imagen
            </div>
        </section>
    </main>
</body>
</html>
